[settings]
minimum_release_age = "7d"  # default is 24h

[tools]
# Required for mise completions
usage = "6.12.0"

neovim = "latest"
tree-sitter = "latest"

opencode = "latest"

terraform = "1"
terraform-docs = "latest"
terragrunt = "1"
tflint = "latest"
trivy = "latest"

kind = "latest"
kubectl = "latest"
kubectx = "latest"
kubens = "latest"
helm = "4"

rust = "1"
golang = "1"
node = ["24", "26"]

pnpm = "latest"
uv = "latest"

jq = "latest"
yq = "latest"

prek = "latest"
gh = "2"
gum = "latest"
delta = "latest"
cmctl = "latest"

fzf = "latest"
fd = "latest"

[hooks.postinstall]
shell = "bash -c"
run = '''
#!/usr/bin/env bash
set -euo pipefail
COMP_DIR="$HOME/.config/mise/completions"
mkdir -p "$COMP_DIR"

if [ "${MISE_INSTALLED_TOOLS:-[]}" != "[]" ] && [ -n "${MISE_INSTALLED_TOOLS:-}" ]; then
  tools=$(echo "$MISE_INSTALLED_TOOLS" | jq -r '.[].name')
else
  tools=$(mise ls --json | jq -r 'keys[]')
fi

echo "$tools" | while read -r tool; do
  bin=$(mise which "$tool" 2>/dev/null) || continue
  outfile="$COMP_DIR/_${tool}"
  if "$bin" completion zsh &>/dev/null; then
    "$bin" completion zsh > "$outfile" && echo "mise: wrote zsh completions for $tool"
  elif "$bin" completions zsh &>/dev/null; then
    "$bin" completions zsh > "$outfile" && echo "mise: wrote zsh completions for $tool"
  fi
done
'''

[hooks.enter]
shell = "zsh"
script = '''
COMP_DIR="$HOME/.config/mise/completions"
[[ -d "$COMP_DIR" ]] && fpath=("$COMP_DIR" $fpath) && autoload -Uz compinit && compinit -C
'''
